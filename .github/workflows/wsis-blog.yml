name: whatshouldistudy blog

# Researches and writes one blog post a week with Claude (scripts/blog-post.ts):
# Claude picks a topic that isn't on the blog yet, researches it with web
# search and web fetch and writes an English and a Swiss German article. The
# post goes through the checks and a production build and is committed to main,
# where Vercel deploys it. Runs on other branches only upload the post as an
# artifact, they never publish.
#
# Secret: ANTHROPIC_API_KEY. A run costs roughly one to three dollars.

on:
  schedule:
    - cron: '17 5 * * 2' # Tuesdays 05:17 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic of the post; empty = Claude chooses'
        required: false
        default: ''

concurrency:
  group: wsis-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Research and write
        id: post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_TOPIC: ${{ inputs.topic }}
        run: node scripts/blog-post.ts

      - name: Checks
        if: steps.post.outputs.file
        run: |
          pnpm typecheck
          node --test test/blog.test.ts
          pnpm build

      - name: Upload post
        if: steps.post.outputs.file && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: blog-post
          path: content/blog
          retention-days: 7

      - name: Publish
        if: steps.post.outputs.file && github.ref == 'refs/heads/main'
        env:
          TITLE: ${{ steps.post.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name  "whatshouldistudy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog
          git commit -q -m "Blogartikel: ${TITLE}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
