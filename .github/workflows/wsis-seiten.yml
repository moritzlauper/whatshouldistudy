name: whatshouldistudy find pages

# Looks for the official page of the programmes that the data names without a link.
# Stores only institution URLs with programme-name and degree evidence.
# Output is a reviewable artifact; no descriptions or AI readings are published.

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'CH, FR, GB (UK), NL, NO, FI, AU, KR or US'
        default: 'CH'
        required: false
      hosts:
        description: 'Comma-separated domains to search; empty for all institutions without links'
        required: false
        default: ''
      max_pages:
        description: 'Study pages to read per domain at most'
        required: false
        default: '250'

concurrency:
  group: wsis-seiten
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATA_BRANCH: whatshouldistudy-data

jobs:
  find:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Programme data
        run: |
          git fetch -q --depth 1 origin "${DATA_BRANCH}"
          mkdir -p data-in
          git archive FETCH_HEAD | tar -x -C data-in

      - name: Find the pages
        env:
          COUNTRY: ${{ inputs.country }}
          HOSTS: ${{ inputs.hosts }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: node scrapers/discover-programme-pages.ts --data data-in --country "$COUNTRY" --hosts "$HOSTS" --max "$MAX_PAGES" --out page-index/pages.json

      - uses: actions/upload-artifact@v4
        with:
          name: programme-pages-${{ inputs.country }}
          path: page-index
