name: whatshouldistudy checks

# Typecheck, unit tests (matcher, connectors, scrapers on fixtures) and a
# production build of whatshouldistudy on every change to it.

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/wsis-pruefen.yml'
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/wsis-pruefen.yml'

concurrency:
  group: wsis-pruefen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Sample data is up to date
        run: |
          pnpm data:sample
          git diff --exit-code -- data/sample || (echo "::error::data/sample is stale, run pnpm data:sample" && exit 1)

      - name: Build
        run: pnpm build
