name: whatshouldistudy facts

# Reads the official page of every programme that has one (Switzerland for now)
# and keeps what Claude says about it: the facts database, which the site uses to
# rank programmes. Pages that have not changed since the last run are not read
# again. The readings go to a private database (lib/facts-store.ts), not to the
# public data branch: they are part of the paid comparison.
#
# Runs by hand («Run workflow») on main only; a run on another branch would spend
# money without storing anything. Add a weekly schedule once a first run is checked.
#
# Secret: ANTHROPIC_API_KEY. The readings reach the site's private store with this
# run's GitHub Actions token (id-token), which the site checks: no database secret
# is kept in GitHub.

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code of the programme data'
        required: false
        default: 'CH'
      limit:
        description: 'Read at most this many programmes (0 = all). A small number for a first check.'
        required: false
        default: '0'
      max_usd:
        description: 'Spending cap for this run, in US dollars'
        required: false
        default: '3'
      reread:
        description: 'Read every page again, also the unchanged ones (after a change to the prompt)'
        required: false
        default: false
        type: boolean

concurrency:
  group: wsis-fakten
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  DATA_BRANCH: whatshouldistudy-data
  WSIS_SITE_URL: https://wasstudieren.ch

jobs:
  read:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: The site's store answers
        env:
          COUNTRY: ${{ inputs.country }}
        run: node scrapers/programme-facts-store.ts ping --country "$COUNTRY"

      - name: Programme data
        run: |
          git fetch -q --depth 1 origin "${DATA_BRANCH}"
          mkdir -p data-in
          git archive FETCH_HEAD | tar -x -C data-in
          echo "Programme shards: $(ls data-in/programmes | wc -l)"

      - name: Readings stored so far
        env:
          COUNTRY: ${{ inputs.country }}
        run: node scrapers/programme-facts-store.ts pull --country "$COUNTRY" --out facts-prev/facts.json

      - name: Read the official pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNTRY: ${{ inputs.country }}
          LIMIT: ${{ inputs.limit }}
          MAX_USD: ${{ inputs.max_usd }}
          REREAD: ${{ inputs.reread }}
        run: |
          EXTRA=""
          if [ "$REREAD" = "true" ]; then EXTRA="--reread"; fi
          node scrapers/programme-facts.ts --data data-in --previous facts-prev/facts.json \
            --out facts-out/facts.json --country "$COUNTRY" --limit "$LIMIT" --max-usd "$MAX_USD" $EXTRA

      - name: Store the readings
        env:
          COUNTRY: ${{ inputs.country }}
        run: node scrapers/programme-facts-store.ts push --country "$COUNTRY" --in facts-out/facts.json
