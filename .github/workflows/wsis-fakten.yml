name: whatshouldistudy facts

# Reads verified programme pages in CH, FR, GB, NL, NO, FI, AU, KR and US
# and keeps what the AI says about it: the facts database, which the site uses to
# rank programmes. Pages that have not changed since the last run are not read
# again. The readings go to a private database (lib/facts-store.ts), not to the
# public data branch: they are part of the paid comparison.
#
# After a successful catalogue refresh (weekly and on scraper changes), or by hand.
# Limits and spending caps apply PER COUNTRY (nine countries for ALL).
#
# Secret: ANTHROPIC_API_KEY (public programme pages only). The readings reach the site's private store with this
# run's GitHub Actions token (id-token), which the site checks: no database secret
# is kept in GitHub.

on:
  workflow_run:
    workflows: ['whatshouldistudy data']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      country:
        description: 'ALL or CH, FR, GB (UK), NL, NO, FI, AU, KR, US'
        required: false
        default: 'ALL'
      limit:
        description: 'Read at most this many programmes (0 = all). A small number for a first check.'
        required: false
        default: '150'
      max_usd:
        description: 'Spending cap PER COUNTRY in USD (ALL = up to nine times this cap)'
        required: false
        default: '1'
      reread:
        description: 'Read every page again, also the unchanged ones (after a change to the prompt)'
        required: false
        default: false
        type: boolean

concurrency:
  group: wsis-fakten
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  DATA_BRANCH: whatshouldistudy-data
  WSIS_SITE_URL: https://wasstudieren.ch

jobs:
  countries:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.select.outputs.countries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: select
        env:
          COUNTRY: ${{ inputs.country || 'ALL' }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { PROGRAMME_COUNTRIES, programmeCountry } from "./lib/programme-countries.ts";
            const value = process.env.COUNTRY.trim().toUpperCase();
            const countries = value === "ALL" ? PROGRAMME_COUNTRIES : [programmeCountry(value)];
            appendFileSync(process.env.GITHUB_OUTPUT, `countries=${JSON.stringify(countries)}\n`);
          '
  read:
    needs: countries
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        country: ${{ fromJSON(needs.countries.outputs.countries) }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: The site's store answers
        env:
          COUNTRY: ${{ matrix.country }}
        run: node scrapers/programme-facts-store.ts ping --country "$COUNTRY"

      - name: Programme data
        run: |
          git fetch -q --depth 1 origin "${DATA_BRANCH}"
          mkdir -p data-in
          git archive FETCH_HEAD | tar -x -C data-in
          echo "Programme shards: $(ls data-in/programmes | wc -l)"

      - name: Readings stored so far
        env:
          COUNTRY: ${{ matrix.country }}
        run: node scrapers/programme-facts-store.ts pull --country "$COUNTRY" --out facts-prev/facts.json

      - name: Restore page discovery and reading progress
        uses: actions/cache/restore@v4
        with:
          path: page-index
          key: programme-pages-v1-${{ matrix.country }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: programme-pages-v1-${{ matrix.country }}-

      - name: Find missing programme pages
        env:
          COUNTRY: ${{ matrix.country }}
        run: node scrapers/discover-programme-pages.ts --data data-in --country "$COUNTRY" --out page-index/pages.json --max-hosts 5 --max 100

      - name: Read the official pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNTRY: ${{ matrix.country }}
          LIMIT: ${{ inputs.limit || '150' }}
          MAX_USD: ${{ inputs.max_usd || '1' }}
          REREAD: ${{ inputs.reread }}
        run: |
          EXTRA=""
          if [ "$REREAD" = "true" ]; then EXTRA="--reread"; fi
          node scrapers/programme-facts.ts --data data-in --previous facts-prev/facts.json \
            --out facts-out/facts.json --country "$COUNTRY" --limit "$LIMIT" --max-usd "$MAX_USD" --pages page-index/pages.json $EXTRA

      - name: Store the readings
        env:
          COUNTRY: ${{ matrix.country }}
        run: node scrapers/programme-facts-store.ts push --country "$COUNTRY" --in facts-out/facts.json

      - name: Save page discovery and reading progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: page-index
          key: programme-pages-v1-${{ matrix.country }}-${{ github.run_id }}-${{ github.run_attempt }}
