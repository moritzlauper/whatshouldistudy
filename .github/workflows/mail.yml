# One mail through the site's mailbox, started by hand (e.g. a request to a
# data publisher). Secrets: SMTP_USER, SMTP_PASS, optionally SMTP_HOST and
# SMTP_PORT. Leave «to» empty to only check the secrets and list the addresses
# on the «lookup» page.
name: Mail

on:
  workflow_dispatch:
    inputs:
      lookup:
        description: Page to read contact addresses from
        required: false
      to:
        description: Recipient (empty = check only)
        required: false
      subject:
        description: Subject
        required: false
      body:
        description: Text
        required: false

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/send-mail.ts
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          LOOKUP: ${{ inputs.lookup }}
          TO: ${{ inputs.to }}
          SUBJECT: ${{ inputs.subject }}
          BODY: ${{ inputs.body }}
